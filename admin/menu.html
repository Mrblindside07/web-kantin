<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Menu - Kantin Biru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
          colors: { accent: { DEFAULT: '#d97706', hover: '#b45309' } }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    if (sessionStorage.getItem('isAdmin') !== 'true') {
      window.location.href = 'login.html';
    }
    function toggleSidebar() {
      const sidebar = document.getElementById('admin-sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }
  </script>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans min-h-screen flex flex-col lg:flex-row">

  <!-- Desktop sidebar -->
  <aside id="admin-sidebar" class="fixed inset-y-0 left-0 w-64 bg-white border-r border-zinc-200 z-40 transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="p-6 border-b border-zinc-200">
      <div class="flex items-center gap-3">
        <img src="../Menu/Logo Kantin Biru V2.png" alt="Logo" class="w-8 h-8">
        <div>
          <h1 class="font-semibold text-sm">Kantin Biru</h1>
          <p class="text-xs text-zinc-400">Admin Panel</p>
        </div>
      </div>
    </div>
    <nav class="p-4 space-y-1">
      <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-zinc-600 hover:bg-zinc-50">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
      </a>
      <a href="menu.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium bg-amber-50 text-amber-700">
        <i data-lucide="utensils-crossed" class="w-4 h-4"></i> Manajemen Menu
      </a>
      <a href="riwayat.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-zinc-600 hover:bg-zinc-50">
        <i data-lucide="history" class="w-4 h-4"></i> Riwayat
      </a>
    </nav>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-zinc-200">
      <button onclick="sessionStorage.removeItem('isAdmin'); window.location.href='login.html'" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-zinc-600 hover:bg-zinc-50 w-full">
        <i data-lucide="log-out" class="w-4 h-4"></i> Logout
      </button>
    </div>
  </aside>

  <!-- Sidebar overlay -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/20 z-30 hidden lg:hidden" onclick="toggleSidebar()"></div>

  <!-- Main content -->
  <main class="flex-1 lg:ml-64 w-full">
    <header class="lg:hidden flex items-center justify-between p-4 bg-white border-b border-zinc-200">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="p-2 -ml-2 text-zinc-600 hover:bg-zinc-50 rounded-md">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <h1 class="font-semibold text-sm">Manajemen Menu</h1>
      </div>
    </header>

    <div class="p-4 lg:p-8 max-w-6xl mx-auto space-y-8">
      
      <!-- Section 1: Tambah Menu & Rekomendasi -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Form Tambah Menu -->
        <div class="lg:col-span-2 rounded-lg border border-zinc-200 bg-white overflow-hidden">
          <div class="p-4 border-b border-zinc-200 bg-zinc-50/50">
            <h2 class="font-semibold">Tambah Menu Baru</h2>
          </div>
          <form id="add-menu-form" class="p-4 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-zinc-700 mb-1">Nama Menu</label>
                <input type="text" id="menu-name" class="w-full px-3 py-2 border border-zinc-300 rounded-md text-sm focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600" required>
              </div>
              <div>
                <label class="block text-sm font-medium text-zinc-700 mb-1">Kategori</label>
                <select id="menu-category" class="w-full px-3 py-2 border border-zinc-300 rounded-md text-sm focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600" required>
                  <option value="berat">Makanan Berat</option>
                  <option value="mie">Mie</option>
                  <option value="cemilan">Cemilan</option>
                  <option value="es">Es</option>
                  <option value="minuman-dingin">Minuman Dingin</option>
                  <option value="minuman-panas">Minuman Panas</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-zinc-700 mb-1">Harga (Rp)</label>
                <input type="number" id="menu-price" class="w-full px-3 py-2 border border-zinc-300 rounded-md text-sm focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600" required>
              </div>
              <div>
                <label class="block text-sm font-medium text-zinc-700 mb-1">Stok Awal</label>
                <input type="number" id="menu-stock" class="w-full px-3 py-2 border border-zinc-300 rounded-md text-sm focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600" required>
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm font-medium text-zinc-700 mb-1">Gambar Menu (Opsional)</label>
                <input type="file" id="menu-image" accept="image/*" class="w-full text-sm text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
              </div>
            </div>
            
            <div class="flex items-center gap-4 py-2 border-y border-zinc-100 mt-4">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="menu-rekomendasi" class="rounded border-zinc-300 text-amber-600 focus:ring-amber-600">
                <span class="text-sm font-medium text-zinc-700">Tandai sebagai Rekomendasi</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="menu-has-variants" class="rounded border-zinc-300 text-amber-600 focus:ring-amber-600">
                <span class="text-sm font-medium text-zinc-700">Memiliki Varian Tambahan</span>
              </label>
            </div>

            <!-- Dynamic variant builder -->
            <div id="variant-builder-container" class="hidden space-y-4 p-4 border border-zinc-200 rounded-md bg-zinc-50/50">
              <div class="flex justify-between items-center">
                <h3 class="text-sm font-medium text-zinc-800">Varian Tambahan (Topping, Ukuran, dll)</h3>
                <button type="button" id="btn-add-variant-group" class="text-xs px-3 py-1.5 bg-zinc-200 hover:bg-zinc-300 text-zinc-700 rounded-md font-medium transition-colors">
                  + Tambah Grup Varian
                </button>
              </div>
              <div id="variant-builder" class="space-y-4">
                <!-- Injected via JS -->
              </div>
            </div>

            <div class="pt-2">
              <button type="submit" id="btn-add-menu" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 px-4 rounded-md text-sm font-medium transition-colors duration-150">
                Tambah Menu
              </button>
            </div>
          </form>
        </div>

        <!-- Rekomendasi Quick Toggle -->
        <div class="rounded-lg border border-zinc-200 bg-white overflow-hidden flex flex-col">
          <div class="p-4 border-b border-zinc-200 bg-zinc-50/50">
            <h2 class="font-semibold">Menu Rekomendasi</h2>
          </div>
          <div class="p-4 border-b border-zinc-100">
            <input type="text" id="reko-search" placeholder="Cari menu..." class="w-full px-3 py-2 border border-zinc-300 rounded-md text-sm focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600">
          </div>
          <div class="flex-1 overflow-y-auto max-h-[400px]">
            <table class="w-full text-sm text-left">
              <tbody id="reko-table-body" class="divide-y divide-zinc-100">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Section 2: Daftar Menu -->
      <div class="rounded-lg border border-zinc-200 bg-white overflow-hidden">
        <div class="p-4 border-b border-zinc-200 bg-zinc-50/50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <h2 class="font-semibold">Daftar Menu</h2>
          <div class="relative w-full sm:w-64">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400"></i>
            <input type="text" id="menu-search" placeholder="Cari menu..." class="w-full pl-9 pr-3 py-2 border border-zinc-300 rounded-md text-sm focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600">
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left text-zinc-600 whitespace-nowrap">
            <thead class="text-xs text-zinc-500 bg-zinc-50 border-b border-zinc-200">
              <tr>
                <th class="px-4 py-3 font-medium">Gambar</th>
                <th class="px-4 py-3 font-medium">Nama Menu</th>
                <th class="px-4 py-3 font-medium">Kategori</th>
                <th class="px-4 py-3 font-medium">Harga</th>
                <th class="px-4 py-3 font-medium">Stok</th>
                <th class="px-4 py-3 font-medium text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="menu-table-body" class="divide-y divide-zinc-100">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
        <div id="menu-pagination" class="p-4 border-t border-zinc-200 flex justify-center gap-2">
          <!-- Pagination -->
        </div>
      </div>

    </div>
  </main>

  <!-- Edit Modal Container -->
  <div id="edit-menu-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
    <!-- Diisi oleh JS -->
  </div>

  <script type="module" src="../firebase-config.js"></script>
  <script type="module" src="admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      // Setup UI toggles
      const hasVariants = document.getElementById('menu-has-variants');
      const builder = document.getElementById('variant-builder-container');
      if (hasVariants && builder) {
        hasVariants.addEventListener('change', (e) => {
          if (e.target.checked) builder.classList.remove('hidden');
          else builder.classList.add('hidden');
        });
      }
    });
  </script>
</body>
</html>
