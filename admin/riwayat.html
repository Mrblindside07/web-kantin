<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pesanan - Kantin Biru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
          colors: { accent: { DEFAULT: '#d97706', hover: '#b45309' } }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .animate-pop {
      animation: pop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
  <script>
    if (sessionStorage.getItem('isAdmin') !== 'true') {
      window.location.href = 'login.html';
    }
    function toggleSidebar() {
      const sidebar = document.getElementById('admin-sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }
  </script>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans min-h-screen flex flex-col lg:flex-row">

  <!-- Desktop sidebar -->
  <aside id="admin-sidebar" class="fixed inset-y-0 left-0 w-64 bg-white border-r border-zinc-200 z-40 transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="p-6 border-b border-zinc-200">
      <div class="flex items-center gap-3">
        <img src="../Menu/Logo Kantin Biru V2.png" alt="Logo" class="w-8 h-8">
        <div>
          <h1 class="font-semibold text-sm">Kantin Biru</h1>
          <p class="text-xs text-zinc-400">Admin Panel</p>
        </div>
      </div>
    </div>
    <nav class="p-4 space-y-1">
      <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-zinc-600 hover:bg-zinc-50 active:scale-[0.98] transition-transform duration-150">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
      </a>
      <a href="menu.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-zinc-600 hover:bg-zinc-50 active:scale-[0.98] transition-transform duration-150">
        <i data-lucide="utensils-crossed" class="w-4 h-4"></i> Manajemen Menu
      </a>
      <a href="riwayat.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium bg-amber-50 text-amber-700 active:scale-[0.98] transition-transform duration-150">
        <i data-lucide="history" class="w-4 h-4"></i> Riwayat
      </a>
    </nav>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-zinc-200">
      <button onclick="sessionStorage.removeItem('isAdmin'); window.location.href='login.html'" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-zinc-600 hover:bg-zinc-50 active:scale-[0.98] transition-transform duration-150 w-full">
        <i data-lucide="log-out" class="w-4 h-4"></i> Logout
      </button>
    </div>
  </aside>

  <!-- Sidebar overlay -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/20 z-30 hidden lg:hidden" onclick="toggleSidebar()"></div>

  <!-- Main content -->
  <main class="flex-1 lg:ml-64 w-full">
    <header class="lg:hidden flex items-center justify-between p-4 bg-white border-b border-zinc-200">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="p-2 -ml-2 text-zinc-600 hover:bg-zinc-50 active:scale-90 transition-transform duration-150 rounded-md">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <h1 class="font-semibold text-sm">Riwayat</h1>
      </div>
    </header>

    <div class="p-4 lg:p-8 max-w-6xl mx-auto space-y-6">
      
      <!-- Stats / Chart Row -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="rounded-lg border border-zinc-200 bg-white p-6 flex flex-col justify-center">
          <h2 class="text-sm font-medium text-zinc-500 mb-2">Pendapatan Hari Ini</h2>
          <div id="today-revenue" class="text-3xl font-semibold text-amber-600 tracking-tight">Rp0</div>
        </div>
        <div class="md:col-span-2 rounded-lg border border-zinc-200 bg-white p-4">
          <h2 class="text-sm font-medium text-zinc-700 mb-4 px-2">Pendapatan 7 Hari Terakhir</h2>
          <div id="weekly-chart-container" class="h-48 w-full flex items-end justify-center">
            <!-- Chart rendered via JS -->
            <p class="text-sm text-zinc-400 mb-10">Chart loading...</p>
          </div>
        </div>
      </div>

      <!-- Riwayat Transaksi -->
      <div class="rounded-lg border border-zinc-200 bg-white overflow-hidden flex flex-col max-h-[800px]">
        <div class="p-4 border-b border-zinc-200 bg-zinc-50/50">
          <h2 class="font-semibold">Riwayat Pesanan Selesai</h2>
        </div>
        <div class="overflow-x-auto flex-1">
          <table class="w-full text-sm text-left whitespace-nowrap">
            <thead class="text-xs text-zinc-500 bg-zinc-50 border-b border-zinc-200 sticky top-0">
              <tr>
                <th class="px-4 py-3 font-medium">Waktu</th>
                <th class="px-4 py-3 font-medium">Kode</th>
                <th class="px-4 py-3 font-medium">Item</th>
                <th class="px-4 py-3 font-medium">Total</th>
                <th class="px-4 py-3 font-medium">Pembayaran</th>
                <th class="px-4 py-3 font-medium">Tipe</th>
              </tr>
            </thead>
            <tbody id="completed-orders-table" class="divide-y divide-zinc-100 text-zinc-600">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="../firebase-config.js"></script>
  <script type="module" src="admin.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
</body>
</html>
