<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Kantin Biru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
          colors: { accent: { DEFAULT: '#d97706', hover: '#b45309' } }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="rounded-lg border border-zinc-200 bg-white p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <img src="../Menu/Logo Kantin Biru V2.png" alt="Logo" class="w-16 h-16 mx-auto mb-3">
      <h1 class="text-xl font-semibold tracking-tight">Admin Panel</h1>
      <p class="text-sm text-zinc-500">Masuk ke akun admin Anda</p>
    </div>

    <form id="login-form" class="space-y-4" onsubmit="event.preventDefault(); handleLogin();">
      <div>
        <label for="admin-username" class="block text-sm font-medium text-zinc-700 mb-1">Username</label>
        <input type="text" id="admin-username" class="w-full px-3 py-2 border border-zinc-300 rounded-md text-sm focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600" required>
      </div>
      <div>
        <label for="admin-password" class="block text-sm font-medium text-zinc-700 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="admin-password" class="w-full px-3 py-2 border border-zinc-300 rounded-md text-sm focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600 pr-10" required>
          <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 px-3 flex items-center text-zinc-400 hover:text-zinc-600">
            <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      
      <div id="login-error" class="hidden text-sm text-red-500 font-medium text-center"></div>
      
      <button type="submit" id="btn-login" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-md text-sm font-medium transition-colors duration-150">Masuk</button>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    
    function togglePassword() {
      const input = document.getElementById('admin-password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }
    
    function handleLogin() {
      const user = document.getElementById('admin-username').value;
      const pass = document.getElementById('admin-password').value;
      const error = document.getElementById('login-error');
      
      if (user === 'AkuAdminWell' && pass === 'tugas imk well banget') {
        sessionStorage.setItem('isAdmin', 'true');
        window.location.href = 'index.html';
      } else {
        error.textContent = 'Username atau password salah';
        error.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
