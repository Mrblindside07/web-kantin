<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kantin Biru - Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
          colors: {
            accent: { DEFAULT: '#d97706', hover: '#b45309' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .animate-pop {
      animation: pop 180ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans min-h-screen pb-24 md:pb-8">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white border-b border-zinc-200">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <img src="Menu/Logo Kantin Biru V2.png" alt="Logo" class="w-8 h-8 object-contain">
        <h1 class="text-lg font-semibold tracking-tight text-zinc-900">Kantin Biru</h1>
      </a>
      <div class="flex items-center gap-4">
        <!-- Desktop Nav -->
        <nav class="hidden md:flex items-center gap-6 mr-2">
          <a href="index.html" class="text-amber-600 font-medium text-sm">Menu</a>
          <a href="pesanan.html" class="text-zinc-500 hover:text-zinc-900 font-medium text-sm transition-colors duration-150 flex items-center gap-1.5">
            Pesanan
            <span class="desktop-cart-badge hidden px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-600 text-white tabular-nums">0</span>
          </a>
          <a href="tentang.html" class="text-zinc-500 hover:text-zinc-900 font-medium text-sm transition-colors duration-150">Tentang</a>
        </nav>
        <button id="search-toggle-btn" class="text-zinc-600 hover:text-zinc-900 active:scale-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-600/40 rounded-md p-1 transition-all duration-150" aria-label="Toggle Search">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
    
    <!-- Status Bar -->
    <div class="bg-zinc-100 border-t border-zinc-200 px-4 py-1.5 text-xs text-zinc-600 flex items-center gap-4 max-w-5xl mx-auto w-full">
      <div class="flex items-center gap-1.5 text-amber-600 font-medium">
        <span class="text-[10px] animate-pulse">●</span> Buka
      </div>
      <span class="text-zinc-400">|</span>
      <div>08:00 - 16:00 WIB</div>
    </div>

    <!-- Search Bar (Hidden by default) -->
    <div id="search-bar-container" class="hidden border-t border-zinc-200 bg-white px-4 py-3 max-w-5xl mx-auto w-full transition-all duration-200 ease-out">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i data-lucide="search" class="w-4 h-4 text-zinc-400"></i>
        </div>
        <input type="text" id="search-input" oninput="handleMenuSearch(this.value)" class="w-full pl-9 pr-4 py-2 bg-zinc-50 border border-zinc-200 rounded-md text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-600/40 focus-visible:border-amber-600 transition-all duration-150 placeholder-zinc-400" placeholder="Cari makanan atau minuman...">
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <!-- Categories -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-6 -mx-4 px-4 md:mx-0 md:px-0">
      <button data-cat-pill="all" onclick="applyCategoryFilter('all')" class="shrink-0 bg-amber-600 text-white px-4 py-2 rounded-md text-sm font-medium active:scale-95 transition-all duration-150 whitespace-nowrap">Semua</button>
      <button data-cat-pill="rekomendasi" onclick="applyCategoryFilter('rekomendasi')" class="shrink-0 bg-white border border-zinc-200 text-zinc-600 hover:bg-zinc-50 active:scale-95 px-4 py-2 rounded-md text-sm font-medium transition-all duration-150 whitespace-nowrap">Rekomendasi</button>
      <button data-cat-pill="berat" onclick="applyCategoryFilter('berat')" class="shrink-0 bg-white border border-zinc-200 text-zinc-600 hover:bg-zinc-50 active:scale-95 px-4 py-2 rounded-md text-sm font-medium transition-all duration-150 whitespace-nowrap">Makanan Berat</button>
      <button data-cat-pill="mie" onclick="applyCategoryFilter('mie')" class="shrink-0 bg-white border border-zinc-200 text-zinc-600 hover:bg-zinc-50 active:scale-95 px-4 py-2 rounded-md text-sm font-medium transition-all duration-150 whitespace-nowrap">Mie</button>
      <button data-cat-pill="cemilan" onclick="applyCategoryFilter('cemilan')" class="shrink-0 bg-white border border-zinc-200 text-zinc-600 hover:bg-zinc-50 active:scale-95 px-4 py-2 rounded-md text-sm font-medium transition-all duration-150 whitespace-nowrap">Cemilan</button>
      <button data-cat-pill="es" onclick="applyCategoryFilter('es')" class="shrink-0 bg-white border border-zinc-200 text-zinc-600 hover:bg-zinc-50 active:scale-95 px-4 py-2 rounded-md text-sm font-medium transition-all duration-150 whitespace-nowrap">Ice Cream</button>
      <button data-cat-pill="minuman-dingin" onclick="applyCategoryFilter('minuman-dingin')" class="shrink-0 bg-white border border-zinc-200 text-zinc-600 hover:bg-zinc-50 active:scale-95 px-4 py-2 rounded-md text-sm font-medium transition-all duration-150 whitespace-nowrap">Minuman Dingin</button>
      <button data-cat-pill="minuman-panas" onclick="applyCategoryFilter('minuman-panas')" class="shrink-0 bg-white border border-zinc-200 text-zinc-600 hover:bg-zinc-50 active:scale-95 px-4 py-2 rounded-md text-sm font-medium transition-all duration-150 whitespace-nowrap">Minuman Panas</button>
    </div>

    <!-- Menu Grid -->
    <div id="menu-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Skeletons -->
      <div class="rounded-lg border border-zinc-200 bg-white overflow-hidden animate-pulse">
        <div class="aspect-[4/3] bg-zinc-200"></div>
        <div class="p-3">
          <div class="h-4 bg-zinc-200 rounded w-3/4 mb-2"></div>
          <div class="h-4 bg-zinc-200 rounded w-1/2 mb-4"></div>
          <div class="h-8 bg-zinc-200 rounded w-full"></div>
        </div>
      </div>
      <div class="rounded-lg border border-zinc-200 bg-white overflow-hidden animate-pulse">
        <div class="aspect-[4/3] bg-zinc-200"></div>
        <div class="p-3">
          <div class="h-4 bg-zinc-200 rounded w-3/4 mb-2"></div>
          <div class="h-4 bg-zinc-200 rounded w-1/2 mb-4"></div>
          <div class="h-8 bg-zinc-200 rounded w-full"></div>
        </div>
      </div>
      <div class="rounded-lg border border-zinc-200 bg-white overflow-hidden animate-pulse hidden md:block">
        <div class="aspect-[4/3] bg-zinc-200"></div>
        <div class="p-3">
          <div class="h-4 bg-zinc-200 rounded w-3/4 mb-2"></div>
          <div class="h-4 bg-zinc-200 rounded w-1/2 mb-4"></div>
          <div class="h-8 bg-zinc-200 rounded w-full"></div>
        </div>
      </div>
      <div class="rounded-lg border border-zinc-200 bg-white overflow-hidden animate-pulse hidden lg:block">
        <div class="aspect-[4/3] bg-zinc-200"></div>
        <div class="p-3">
          <div class="h-4 bg-zinc-200 rounded w-3/4 mb-2"></div>
          <div class="h-4 bg-zinc-200 rounded w-1/2 mb-4"></div>
          <div class="h-8 bg-zinc-200 rounded w-full"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Mobile Floating Cart -->
  <div id="floating-cart-mobile" class="fixed bottom-16 left-0 right-0 p-4 z-40 md:hidden hidden transition-all duration-300 ease-out">
    <a href="pesanan.html" class="bg-zinc-900 text-white rounded-lg p-3.5 shadow-lg flex items-center justify-between border border-zinc-800 active:scale-[0.98] transition-all duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-600/40">
      <div class="flex items-center gap-3">
        <div class="bg-zinc-800 rounded-md p-2">
          <i data-lucide="shopping-bag" class="w-5 h-5 text-amber-500"></i>
        </div>
        <div>
          <p class="cart-total-qty text-xs text-zinc-400 font-medium">0 item</p>
          <p class="cart-total-price text-sm font-semibold text-white">Rp 0</p>
        </div>
      </div>
      <div class="text-xs font-semibold text-amber-500 flex items-center gap-1 bg-zinc-800 px-3 py-1.5 rounded-md active:scale-95 transition-transform">
        Lihat Pesanan <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
      </div>
    </a>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-zinc-200 z-50 md:hidden">
    <div class="flex justify-around items-center h-16">
      <a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-amber-600 gap-1 active:scale-90 transition-transform duration-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-600/40 inset-0 relative">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Beranda</span>
      </a>
      <a href="pesanan.html" class="flex flex-col items-center justify-center w-full h-full text-zinc-400 hover:text-zinc-600 active:scale-90 transition-transform duration-100 gap-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-600/40 relative">
        <i data-lucide="clipboard-list" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Pesanan</span>
      </a>
      <a href="tentang.html" class="flex flex-col items-center justify-center w-full h-full text-zinc-400 hover:text-zinc-600 active:scale-90 transition-transform duration-100 gap-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-600/40 relative">
        <i data-lucide="info" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Tentang</span>
      </a>
    </div>
  </nav>

  <!-- Variant Modal -->
  <div id="variantModal" class="fixed inset-0 z-[100] hidden items-end md:items-center justify-center">
    <!-- Overlay -->
    <div class="absolute inset-0 bg-zinc-900/40 transition-opacity duration-200" onclick="window.kantinApp.closeVariantModal()"></div>
    <!-- Content -->
    <div id="variantContent" class="relative bg-white w-full md:w-[480px] rounded-t-lg md:rounded-lg flex flex-col max-h-[85vh] transition-all duration-200 ease-out z-10">
      <div class="p-4 border-b border-zinc-200 flex items-start justify-between">
        <div>
          <h3 id="variant-item-name" class="text-base font-semibold text-zinc-900">Nama Item</h3>
          <p id="variant-item-price" class="text-amber-600 font-semibold text-sm">Rp 0</p>
        </div>
        <button onclick="window.kantinApp.closeVariantModal()" class="text-zinc-400 hover:text-zinc-600 active:scale-90 p-1 rounded-md transition-all duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-600/40" aria-label="Tutup Modal">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div id="variant-options-container" class="p-4 overflow-y-auto no-scrollbar flex-1 space-y-4">
        <!-- Variant options injected here -->
      </div>
      
      <div class="p-4 border-t border-zinc-200 bg-zinc-50/50 rounded-b-lg">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm font-medium text-zinc-600">Total Harga</span>
          <span id="variant-total-price" class="text-lg font-bold text-zinc-900 tabular-nums">Rp 0</span>
        </div>
        <button onclick="window.kantinApp.addToCartWithVariants()" class="w-full bg-amber-600 hover:bg-amber-700 active:scale-[0.98] text-white px-4 py-2.5 rounded-md text-sm font-medium transition-all duration-150 shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-600/40 focus-visible:ring-offset-2">
          Tambah ke Keranjang
        </button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('search-toggle-btn').addEventListener('click', () => {
      const searchContainer = document.getElementById('search-bar-container');
      const isHidden = searchContainer.classList.contains('hidden');
      if (isHidden) {
        searchContainer.classList.remove('hidden');
        document.getElementById('search-input').focus();
      } else {
        searchContainer.classList.add('hidden');
      }
    });
  </script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
</body>
</html>
